name: Build pyoccam wheels on GitHub

on:
  push:
    branches: [pyoccam-port]
  pull_request:
    branches: [pyoccam-port]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Windows-specific: Install MinGW
    - name: Set up MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gcc-libs
          mingw-w64-x86_64-gcc-objc
          mingw-w64-x86_64-cmake
          make
    
    # Add MinGW to PATH for Windows
    - name: Add MinGW to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "${{ runner.temp }}/msys64/mingw64/bin" >> $GITHUB_PATH
      shell: bash
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 numpy wheel setuptools
    
    - name: Debug - Show structure
      run: |
        echo "Repository structure:"
        ls -la
        echo "PyOccam contents:"
        ls -la pyoccam/
        echo "Python version:"
        python --version
        echo "Compiler version (Unix):"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          gcc --version || echo "GCC not found"
        fi
      shell: bash
    
    - name: Build wheel (Windows with MinGW)
      if: runner.os == 'Windows'
      shell: cmd
      working-directory: ./pyoccam
      run: |
        python setup.py build_ext --compiler=mingw32 --inplace
        python setup.py bdist_wheel
    
    - name: Build wheel (Linux/Mac)
      if: runner.os != 'Windows'
      run: |
        cd pyoccam
        python setup.py build_ext --inplace
        python setup.py bdist_wheel
    
    - name: List built wheels
      run: |
        echo "Built wheels:"
        ls -la pyoccam/dist/
      shell: bash
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: pyoccam/dist/*.whl
        retention-days: 30