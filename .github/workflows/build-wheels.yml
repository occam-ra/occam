name: Build Wheels (Simple Version)

on:
  push:
    branches:
      - pyoccam-port
  workflow_dispatch:

jobs:
  # Build one sdist so pip has a source fallback (e.g., on Colab if no matching wheel)
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          python -m pip install -U pip build pybind11
          python -m build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Build Linux and macOS wheels (cp39..cp312). Windows intentionally skipped for now.
  build_unix_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux* cp3*-win*"
          CIBW_BEFORE_BUILD: "pip install pybind11"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_ARCHS_MACOS: "universal2"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Optional helper: if you commit manually built Windows wheels to windows-wheels/, we’ll upload them too
  check_windows_wheels:
    name: Check for Windows wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Windows wheels in repo
        id: check
        run: |
          if [ -d "windows-wheels" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found windows-wheels directory"
            ls -la windows-wheels/
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No windows-wheels directory found"
          fi
      - name: Upload Windows wheels if found
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: windows-wheels/*.whl

  # Collect everything (wheels + sdist) and publish
  upload_wheels:
    name: Upload to PyPI
    needs: [sdist, build_unix_wheels, check_windows_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected files
        run: |
          echo "Dist contents:"
          ls -la dist || true
          echo ""
          echo "Linux wheels:   $(ls dist/*linux*.whl 2>/dev/null | wc -l)"
          echo "macOS wheels:   $(ls dist/*macos*.whl 2>/dev/null | wc -l)"
          echo "Windows wheels: $(ls dist/*win*.whl   2>/dev/null | wc -l)"
          echo "sdist:          $(ls dist/*.tar.gz     2>/dev/null | wc -l)"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to Production PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
