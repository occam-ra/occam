name: Build Wheels (Simple Version)

# This simpler version:
# - Builds Linux/macOS wheels with cibuildwheel
# - Expects you to upload Windows wheels manually

on:
  push:
    branches:
      - pyoccam-port
  workflow_dispatch:

jobs:
  # Build Linux and macOS wheels
  build_unix_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-*"
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux*"
          CIBW_BEFORE_BUILD: "pip install pybind11"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_ARCHS_MACOS: "x86_64 arm64 universal2"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Check for manually uploaded Windows wheels
  check_windows_wheels:
    name: Check for Windows wheels
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for Windows wheels in repo
        id: check
        run: |
          if [ -d "windows-wheels" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found windows-wheels directory"
            ls -la windows-wheels/
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No windows-wheels directory found"
            echo ""
            echo "To add Windows wheels:"
            echo "1. Build locally: python build_windows_wheels_auto.py"
            echo "2. Create windows-wheels/ directory in repo"
            echo "3. Copy the .whl files there"
            echo "4. Commit and push"
          fi

      - name: Upload Windows wheels if found
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: windows-wheels/*.whl

  # Collect and upload to TestPyPI
  upload_wheels:
    name: Upload to TestPyPI
    needs: [build_unix_wheels, check_windows_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected wheels
        run: |
          echo "Collected wheels:"
          ls -la dist/*.whl || echo "No wheels found"
          
          # Count by platform
          echo ""
          echo "Linux wheels: $(ls dist/*linux*.whl 2>/dev/null | wc -l)"
          echo "macOS wheels: $(ls dist/*macos*.whl 2>/dev/null | wc -l)"  
          echo "Windows wheels: $(ls dist/*win*.whl 2>/dev/null | wc -l)"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
