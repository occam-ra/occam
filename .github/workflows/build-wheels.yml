name: Build pyoccam wheels on GitHub

on:
  push:
    branches: [pyoccam-port]
    paths:
      - 'pyoccam/**'
      - 'cpp/**'
      - 'include/**'
      - '.github/workflows/build-pyoccam.yml'
  pull_request:
    branches: [pyoccam-port]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install MinGW (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-libs
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 wheel setuptools
    
    - name: Build wheel (Windows)
      if: runner.os == 'Windows'
      working-directory: ./pyoccam
      run: |
        python setup.py build_ext --compiler=mingw32 --inplace
        python setup.py bdist_wheel
    
    - name: Build wheel (Unix)
      if: runner.os != 'Windows'
      run: |
        cd pyoccam
        python setup.py build_ext --inplace
        python setup.py bdist_wheel
    
    - name: Upload wheels
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
        path: pyoccam/dist/*.whl