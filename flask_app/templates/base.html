<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OCCAM 3{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
</head>
<body>
<table id="PSUPage" cellspacing="0" cellpadding="0" border="0">
<tbody>
<tr valign="top">
<td id="PSUBody">
    <!-- PSU Branding -->
    <div id="PSUBrandingBackground">
        <table border="0" cellpadding="0" cellspacing="0" id="PSUBranding" width="100%">
            <tbody>
            <tr>
                <td id="PSUHeader"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Main Content -->
    <div id="PSUContentBackground">
        <div id="PSUContent">
            <table id="Occam" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tbody>
                <tr>
                    <td id="PSUColumnMain">
                        <a href="{{ url_for('index') }}">
                            <img border="0" width="156" height="52" src="{{ url_for('static', filename='occam_logo.jpg') }}" alt="OCCAM Logo">
                        </a>&nbsp;
                        <span style="vertical-align: 60%">
                            version {{ version }} &nbsp; &mdash; &nbsp; {{ date }}
                        </span>
                        <br>

                        {% block content %}{% endblock %}

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <div style="clear: both">
        <div id="PSUFooterBackground">
            <div id="PSUFooter">
                <a target="_blank" href="https://www.occam-ra.io" title="OCCAM Open Source Project Information">
                    &copy; 2000-2025 OCCAM Open Source Project
                </a>
            </div>
        </div>
    </div>
</td>
<td id="PSUMarginRight"> </td>
</tr>
</tbody>
</table>
</body>
</html>
