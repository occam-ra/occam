[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
user=redis
stdout_logfile=/var/www/occam/logs/redis-stdout.log
stderr_logfile=/var/www/occam/logs/redis-stderr.log
priority=1

[program:gunicorn]
command=/usr/local/bin/gunicorn -c /var/www/occam/gunicorn_config.py app:app
directory=/var/www/occam/occam_server
autostart=true
autorestart=true
user=occam
stdout_logfile=/var/www/occam/logs/gunicorn-stdout.log
stderr_logfile=/var/www/occam/logs/gunicorn-stderr.log
priority=10
environment=REDIS_URL="redis://127.0.0.1:6379/0"

[program:rq-worker]
command=/usr/bin/python3 worker.py
directory=/var/www/occam/occam_server
autostart=true
autorestart=true
user=occam
stdout_logfile=/var/www/occam/logs/worker-stdout.log
stderr_logfile=/var/www/occam/logs/worker-stderr.log
priority=10
environment=REDIS_URL="redis://127.0.0.1:6379/0",SMTP_HOST="localhost",SMTP_PORT="25"
