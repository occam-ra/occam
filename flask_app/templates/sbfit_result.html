{% extends "base.html" %}

{% block title %}OCCAM State-Based Fit Results{% endblock %}

{% block content %}
<h2>State-Based Model Fit Results</h2>

<div class="results">
    <p><strong>Model:</strong> {{ model }}</p>
    <p><strong>Elapsed time:</strong> {{ "%.2f"|format(elapsed) }} seconds</p>
</div>

<pre class="output">{{ output }}</pre>

<div class="actions">
    <p>
        <a href="{{ url_for('occam_main') }}">Return to Input Form</a> |
        <a href="{{ url_for('index') }}">Return to Home</a>
    </p>
</div>
{% endblock %}
