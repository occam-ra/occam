[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "pybind11>=2.6.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyoccam"
version = "0.1.0"
description = "OCCAM Reconstructability Analysis Tools - Python bindings for model search and fit"
readme = "README.md"
authors = [
    {name = "David Percy", email = "percyd@pdx.edu"},
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10", 
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",  # If needed by demos or future helpers
]

[project.urls]
"Homepage" = "https://github.com/occam-ra/occam"
"Source" = "https://github.com/occam-ra/occam"
"Bug Tracker" = "https://github.com/occam-ra/occam/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "matplotlib",  # For visualization helpers
    "pandas",      # For data manipulation
]

[tool.setuptools]
packages = ["pyoccam"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
pyoccam = [
    "*.pyd",
    "*.so", 
    "*.dll",
    "*.txt",
    "*.csv",
    "pyoccam_demo.py",
    "pyoccam_demo.ipynb",
    "*.ipynb",
]
